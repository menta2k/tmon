name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDPI_TAG: "6.0"

jobs:
  backend:
    name: Backend (fmt, clippy, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo lint
      - name: Build fake sidecar (DPI integration tests)
        run: cargo build -q -p tmon-dpi-client --example fake_dpi
      - name: Tests
        run: TMON_FAKE_DPI="$PWD/target/debug/examples/fake_dpi" cargo test --workspace --locked

  backend-msrv:
    name: Backend MSRV (1.88)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo check --workspace --locked

  dpi-sidecar:
    name: DPI sidecar (nDPI)
    runs-on: ubuntu-latest
    env:
      # Outside target/: the Rust cache step restores and prunes target/.
      NDPI_PREFIX: ${{ github.workspace }}/.ndpi
    steps:
      - uses: actions/checkout@v5
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends autoconf automake libtool pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        id: ndpi
        with:
          path: .ndpi
          key: ndpi-${{ runner.os }}-${{ env.NDPI_TAG }}-v2
      - name: Build nDPI
        if: steps.ndpi.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$NDPI_TAG" https://github.com/ntop/nDPI.git /tmp/ndpi-src
          cd /tmp/ndpi-src
          ./autogen.sh >/dev/null
          ./configure --with-only-libndpi --prefix="$NDPI_PREFIX" >/dev/null
          make -j"$(nproc)" -C src/lib >/dev/null
          make -C src/lib install >/dev/null
          make install-pkgconfigDATA >/dev/null
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/dpi
      - name: Format
        working-directory: backend/dpi
        run: cargo fmt --all -- --check
      - name: Clippy and tests
        working-directory: backend/dpi
        run: |
          export PKG_CONFIG_PATH="$NDPI_PREFIX/lib/pkgconfig" LD_LIBRARY_PATH="$NDPI_PREFIX/lib"
          cargo clippy --all-targets -- -D warnings
          cargo test --locked

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test:unit
      - run: pnpm build

  docker:
    name: Docker images (ghcr.io)
    runs-on: ubuntu-latest
    needs: [backend, frontend, dpi-sidecar]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      # Pull requests build and check the images but never publish them.
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags: base = latest / vX.Y.Z / X.Y / sha-<short>; nDPI variant = the same with a -dpi suffix.
      - name: Tags (base)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Tags (dpi)
        id: meta-dpi
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=-dpi,onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build base image (no nDPI)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: tmon
          tags: tmon:ci
          load: true
          cache-from: type=gha,scope=tmon
          cache-to: type=gha,mode=max,scope=tmon
      - name: Base image must not contain libndpi (LGPL isolation)
        run: |
          id=$(docker create tmon:ci)
          trap 'docker rm -f "$id" >/dev/null' EXIT
          if docker export "$id" | tar -t | grep -q libndpi; then echo "libndpi in base image" >&2; exit 1; fi
          echo "base image has no libndpi"
      - name: Push base image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: tmon
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tmon
      - name: Build and push nDPI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: tmon-dpi
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta-dpi.outputs.tags }}
          labels: ${{ steps.meta-dpi.outputs.labels }}
          cache-from: type=gha,scope=tmon-dpi
          cache-to: type=gha,mode=max,scope=tmon-dpi
