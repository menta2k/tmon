# Usage (from the repository root):
#   echo -n 'your-password' | docker run --rm -i tmon hash-password   # → .env as TMON_HTTP__PASSWORD_HASH='<hash>' (single quotes: the hash contains $)
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml run --rm tmon geoip-update --config /etc/tmon/tmon.toml
services:
  tmon:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tmon:latest
    restart: unless-stopped
    env_file: .env            # TMON_HTTP__PASSWORD_HASH='...' (quoted),, optional TMON_ROUTER__PASSWORD=...
    ports:
      - "8080:8080/tcp"
      - "2055:2055/udp"
      - "4739:4739/udp"
      - "6343:6343/udp"
    volumes:
      - tmon-data:/var/lib/tmon
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 2

volumes:
  tmon-data:
