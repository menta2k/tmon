[workspace]
resolver = "2"
members = [
    "crates/tmon-core",
    "crates/tmon-collector",
    "crates/tmon-capture",
    "crates/tmon-enrich",
    "crates/tmon-store",
    "crates/tmon-api",
    "crates/tmon-dpi-proto",
    "crates/tmon-dpi-client",
    "crates/tmon",
]
# The nDPI sidecar is its own workspace (needs a C toolchain + libndpi).
exclude = ["dpi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
tmon-core = { path = "crates/tmon-core" }
tmon-collector = { path = "crates/tmon-collector" }
tmon-capture = { path = "crates/tmon-capture" }
tmon-enrich = { path = "crates/tmon-enrich" }
tmon-store = { path = "crates/tmon-store" }
tmon-api = { path = "crates/tmon-api" }
tmon-dpi-proto = { path = "crates/tmon-dpi-proto" }
tmon-dpi-client = { path = "crates/tmon-dpi-client" }

tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-stream = "0.3"
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.6", features = ["compression-gzip", "trace", "timeout", "set-header"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
netflow_parser = "1.0.6"
sflow-parser = "0.7"
duckdb = { version = "1.20000.1", features = ["bundled", "parquet"] }
maxminddb = "0.32"
prefix-trie = "0.10"
globset = "0.4"
arc-swap = "1"
lru = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
figment = { version = "0.10", features = ["toml", "env"] }
argon2 = "0.5"
rand = "0.9"
socket2 = { version = "0.6", features = ["all"] }
csv = "1"
bytes = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
flate2 = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
# capture (feature 002)
etherparse = "0.21"
tls-parser = "0.12"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
ring = "0.17"
httparse = "1.10"
# application classification (feature 003)
command-fds = { version = "0.3", features = ["tokio"] }
tokio-seqpacket = "0.8"
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }

# dev
proptest = "1"
criterion = "0.7"
wiremock = "0.6"
tempfile = "3"
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 1
debug = false

# Keep the dev cache small: DuckDB is linked statically into every test binary,
# and full debuginfo made target/debug grow to hundreds of GB.
[profile.dev]
debug = "line-tables-only"
